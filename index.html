<title>Founder Forward Journey Analytics</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --card-2:#F8FAFC; --card-3:#EEF2F8;
  --line:#E6EBF3; --line-2:#F0F4F9;
  --text:#0F172A; --text-2:#55637A; --text-3:#93A1B8;
  --accent:#5B3DF5; --accent-soft:#EEEAFE;
  --ok:#0E8AA3; --warn:#A8720A; --no:#BE1D52;
  --ok-w:#E4F3F6; --warn-w:#F7F0E1; --no-w:#FBE8EE;
  --s1:#5B3DF5; --s2:#0E8AA3; --s3:#A8720A; --s4:#BE1D52; --s5:#8796AE;
  --hatch:#C3CDDC;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 12px 28px -14px rgba(15,23,42,.16);
  --shadow-lg:0 2px 6px rgba(15,23,42,.06), 0 24px 48px -20px rgba(15,23,42,.24);
  --r:14px;
}
:root[data-theme="dark"]{
  --bg:#080C1A; --card:#111A2E; --card-2:#18233B; --card-3:#1F2C49;
  --line:#22304D; --line-2:#182440;
  --text:#F1F5F9; --text-2:#9AAAC4; --text-3:#64748B;
  --accent:#8B72FF; --accent-soft:#1E1B45;
  --ok:#35A5BC; --warn:#C08A1A; --no:#DC5580;
  --ok-w:#0C2B33; --warn-w:#2B2109; --no-w:#33121F;
  --s1:#8B72FF; --s2:#35A5BC; --s3:#C08A1A; --s4:#DC5580; --s5:#6B7C99;
  --hatch:#2B3A59;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -16px rgba(0,0,0,.8);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5), 0 28px 56px -22px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--text);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; letter-spacing:-.006em; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.026em}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}
.eyebrow{font-family:"JetBrains Mono",monospace; font-size:9.5px; font-weight:500;
  letter-spacing:.15em; text-transform:uppercase; color:var(--text-3)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
button{font-family:inherit; letter-spacing:inherit; cursor:pointer}

/* ================= shell ================= */
.app{display:grid; grid-template-columns:232px 1fr; min-height:100vh}
.side{background:var(--card); border-right:1px solid var(--line); padding:20px 14px;
  display:flex; flex-direction:column; gap:22px; position:sticky; top:0; height:100vh;
  overflow-y:auto}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px}
.mark{width:32px; height:32px; border-radius:9px; flex:none;
  background:linear-gradient(140deg, var(--s1), var(--s2)); display:grid; place-items:center;
  color:#fff; font-weight:700; font-size:13px; letter-spacing:-.03em}
.brand .bt{font-weight:600; font-size:14px; letter-spacing:-.03em; line-height:1.15}
.brand .bs{font-size:10.5px; color:var(--text-3); letter-spacing:-.005em}
.nav{display:flex; flex-direction:column; gap:2px}
.nav .nl{font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-3); padding:0 10px; margin:6px 0 4px}
.nav button{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; padding:9px 10px; border-radius:9px; color:var(--text-2);
  font-size:13.5px; font-weight:500; letter-spacing:-.012em; transition:all .13s}
.nav button:hover{background:var(--card-2); color:var(--text)}
.nav button[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.nav .ico{width:18px; height:18px; flex:none; opacity:.85}
.nav button[aria-current="true"] .ico{opacity:1}
.side-foot{margin-top:auto; font-size:10.5px; color:var(--text-3); line-height:1.6; padding:0 10px}
.side-foot b{color:var(--text-2); font-weight:500}

.main{min-width:0; display:flex; flex-direction:column}
.top{position:sticky; top:0; z-index:25; background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line); padding:14px 26px; display:flex; flex-wrap:wrap;
  gap:10px; align-items:center}
.top h1{font-size:17px; font-weight:600; letter-spacing:-.03em; margin-right:4px}
.top .sub{font-size:11.5px; color:var(--text-3); width:100%; order:9; margin-top:-2px}
.grow{flex:1}
.ctl{font:500 12.5px/1 "Instrument Sans",sans-serif; color:var(--text); background:var(--card);
  border:1px solid var(--line); border-radius:9px; padding:8px 10px; transition:border-color .12s}
.ctl:hover{border-color:var(--text-3)}
select.ctl{padding-right:8px}
.iconbtn{background:var(--card); border:1px solid var(--line); border-radius:9px; width:34px;
  height:34px; display:grid; place-items:center; color:var(--text-2); transition:all .12s}
.iconbtn:hover{color:var(--text); border-color:var(--text-3)}
.body{padding:20px 26px 70px}

/* ================= filter chips ================= */
.chips{display:flex; flex-wrap:wrap; gap:7px; align-items:center; padding:12px 0 4px;
  min-height:20px}
.chips .lab{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-3); margin-right:2px}
.chip{display:inline-flex; align-items:center; gap:7px; background:var(--accent-soft);
  color:var(--accent); border:0; border-radius:999px; padding:5px 9px 5px 11px;
  font-size:12px; font-weight:500; letter-spacing:-.01em}
.chip .d{font-family:"JetBrains Mono",monospace; font-size:9px; opacity:.65;
  text-transform:uppercase; letter-spacing:.08em}
.chip .x{width:15px; height:15px; border-radius:50%; display:grid; place-items:center;
  background:color-mix(in srgb,var(--accent) 16%,transparent); font-size:11px; line-height:1}
.chip:hover .x{background:var(--accent); color:var(--card)}
.chip-clear{background:none; border:1px dashed var(--line); color:var(--text-3);
  border-radius:999px; padding:5px 11px; font-size:12px}
.chip-clear:hover{color:var(--text); border-color:var(--text-3)}
.chips-empty{font-size:12px; color:var(--text-3)}

/* ================= cards ================= */
.grid{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:14px;
  margin-top:14px; align-items:start}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 18px 14px; box-shadow:var(--shadow); grid-column:span 6; min-width:0}
.c3{grid-column:span 3} .c4{grid-column:span 4} .c5{grid-column:span 5}
.c6{grid-column:span 6} .c7{grid-column:span 7} .c8{grid-column:span 8}
.c9{grid-column:span 9} .c12{grid-column:span 12}
@media (max-width:1180px){.c3,.c4,.c5{grid-column:span 6}}
@media (max-width:820px){.card,.c3,.c4,.c5,.c6,.c7,.c8,.c9,.c12{grid-column:span 12}}
.cardhead{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  margin-bottom:3px}
.card h4{font-size:13px; font-weight:600; letter-spacing:-.022em}
.card .cap{font-size:11px; color:var(--text-3); line-height:1.5; margin:3px 0 12px}
.card svg{display:block; width:100%; height:auto; overflow:visible}
.hint{font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--text-3); opacity:.7}

/* ================= kpi ================= */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:14px}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 17px 13px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.kpi .kt{display:flex; align-items:center; gap:7px; margin-bottom:9px}
.kpi .kdot{width:7px; height:7px; border-radius:2px; flex:none}
.kpi .kl{font-size:11.5px; font-weight:500; color:var(--text-2); letter-spacing:-.008em}
.kpi .kv{font-size:27px; font-weight:600; letter-spacing:-.042em; line-height:1.05;
  font-variant-numeric:tabular-nums}
.kpi .kh{font-size:10.5px; color:var(--text-3); margin-top:4px; line-height:1.45}
.kpi .kspark{position:absolute; right:0; bottom:0; width:56%; opacity:.5; pointer-events:none}

/* ================= tables ================= */
.tbl{width:100%; border-collapse:collapse; font-size:12.5px}
.tbl th{text-align:left; font-family:"JetBrains Mono",monospace; font-size:9px; font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--text-3);
  border-bottom:1px solid var(--line); padding:0 12px 8px 0; white-space:nowrap}
.tbl td{padding:8px 12px 8px 0; border-bottom:1px solid var(--line-2); letter-spacing:-.008em}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  text-align:right; font-size:12px}
.scroll{overflow-x:auto}
.pill{font-family:"JetBrains Mono",monospace; font-size:9px; font-weight:500; padding:3px 7px;
  border-radius:5px; letter-spacing:.06em}
.pill.ok{color:var(--ok); background:var(--ok-w)}
.pill.warn{color:var(--warn); background:var(--warn-w)}
.pill.no{color:var(--no); background:var(--no-w)}

/* ================= notice ================= */
.notice{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 17px; box-shadow:var(--shadow); grid-column:span 12; position:relative}
.notice::before{content:""; position:absolute; left:17px; top:20px; width:6px; height:6px;
  border-radius:50%; background:var(--c,var(--warn))}
.notice h4{font-size:13px; margin-bottom:5px; padding-left:15px}
.notice p{margin:0; font-size:12.5px; color:var(--text-2); padding-left:15px; max-width:88ch}
.vs{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; padding-left:15px}
.vs span{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--text);
  background:var(--card-2); border-radius:6px; padding:5px 9px; font-variant-numeric:tabular-nums}
.vs span i{color:var(--text-3); font-style:normal}

/* ================= misc ================= */
.empty{background:var(--card-2); border-radius:10px; padding:22px 14px; text-align:center;
  color:var(--text-3); font-size:12px}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:10px; font-size:11px;
  color:var(--text-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:9px; height:9px; border-radius:3px; display:inline-block}
.seg{display:inline-flex; background:var(--card-2); border-radius:8px; padding:2px; gap:2px}
.seg button{background:none; border:0; padding:5px 10px; border-radius:6px; font-size:11.5px;
  font-weight:500; color:var(--text-3); letter-spacing:-.01em}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--text); box-shadow:var(--shadow)}
.mk{cursor:pointer; transition:opacity .13s}
.mk:hover{opacity:.82!important}
#tip{position:fixed; pointer-events:none; opacity:0; transition:opacity .1s; background:var(--text);
  color:var(--card); font-family:"JetBrains Mono",monospace; font-size:11px; line-height:1.55;
  padding:7px 10px; border-radius:7px; z-index:70; white-space:pre; font-variant-numeric:tabular-nums;
  box-shadow:var(--shadow-lg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static; height:auto; flex-direction:row; align-items:center; gap:14px;
    overflow-x:auto; padding:12px 14px}
  .side-foot,.nav .nl{display:none}
  .nav{flex-direction:row; gap:4px}
  .nav button{padding:8px 11px; white-space:nowrap}
  .body{padding:16px 16px 60px} .top{padding:12px 16px}
}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark">FF</div>
      <div>
        <div class="bt">Founder Forward</div>
        <div class="bs">Journey analytics</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <b id="sf-src"></b> sources &middot; <b id="sf-rows"></b> rows<br>
      Built <b id="sf-gen"></b>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <h1 id="pt">Overview</h1>
      <div class="grow"></div>
      <label class="eyebrow" for="fy" style="align-self:center">Years</label>
      <select class="ctl" id="fy"></select>
      <select class="ctl" id="ty"></select>
      <button class="ctl" id="copylink" type="button">Copy link</button>
      <button class="iconbtn" id="theme" type="button" aria-label="Toggle theme">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="sub" id="ptsub"></div>
    </header>

    <div class="body">
      <div class="chips" id="chips"></div>
      <div id="view"></div>
    </div>
  </div>
</div>
<div id="tip" class="mono"></div>
<script src="data.js"></script>
<script>
(function(){
var FF = window.FF, ROWS = window.FF_ROWS;
var $ = function(id){ return document.getElementById(id); };
if(!FF || !ROWS){ document.body.innerHTML = '<p style="padding:40px">data.js failed to load.</p>'; return; }

/* ===================== helpers ===================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function usd(n){ n=Math.round(n||0);
  return n>=1000000 ? '$'+(n/1000000).toFixed(2)+'M' : n>=10000 ? '$'+Math.round(n/1000)+'k'
       : '$'+n.toLocaleString('en-US'); }
function usdFull(n){ return '$'+Math.round(n||0).toLocaleString('en-US'); }
function nf(n){ return (n||0).toLocaleString('en-US'); }
var tip=$('tip');
function tipOn(e,t){ tip.textContent=t; tip.style.opacity=1;
  var x=e.clientX+14, y=e.clientY-10;
  if(x+tip.offsetWidth>innerWidth-8) x=e.clientX-tip.offsetWidth-14;
  if(y<6) y=6;
  tip.style.left=x+'px'; tip.style.top=y+'px'; }
function tipOff(){ tip.style.opacity=0; }

/* ===================== dimensions ===================== */
/* label: what the UI calls it. multi: the row value is an array. */
var DIMS = {
  race:     {label:'Race',           multi:true,  demo:true,
             names:{black:'Black / African American', latinx:'Latinx / Hispanic',
                    aapi:'Asian American / Pacific Islander',
                    indigenous:'Indigenous / Native American', multiracial:'Multiracial'}},
  gender:   {label:'Gender',         demo:true},
  veteran:  {label:'Veteran status', demo:true},
  lgbtq:    {label:'LGBTQI+',        demo:true},
  region:   {label:'Region'},
  state:    {label:'State'},
  city:     {label:'City'},
  stage:    {label:'Growth stage'},
  solution: {label:'Solution type'},
  era:      {label:'Era'},
  purpose:  {label:'Award programme'},
  captype:  {label:'Capital type'},
  alive:    {label:'Still in business'},
  partner:  {label:'Partner', multi:true},
  cohort:   {label:'Cohort'},
  y:        {label:'Year'}
};
function dimName(d,v){
  var D=DIMS[d]; return (D && D.names && D.names[v]) ? D.names[v] : String(v);
}

/* ===================== state ===================== */
var YEARS = ROWS.map(function(r){return r.y;}).filter(Boolean);
var Y0=Math.min.apply(null,YEARS), Y1=Math.max.apply(null,YEARS);
var st = {page:'overview', from:Y0, to:Y1, f:{}, xa:'city', xb:'race', measure:'founders'};

function sel(d){ return st.f[d] || (st.f[d]=new Set()); }
function toggle(d,v){
  var s=sel(d);
  if(s.has(v)) s.delete(v); else s.add(v);
  if(!s.size) delete st.f[d];
  render();
}
function activeDims(){ return Object.keys(st.f).filter(function(d){ return st.f[d].size; }); }

/* ---- the crossfilter core.
   A chart on dimension D must ignore D's own selection, otherwise selecting a
   value collapses that chart to one bar and there is no way back. ---- */
function apply(exceptDim){
  var dims = activeDims();
  return ROWS.filter(function(r){
    if(r.y != null && (r.y < st.from || r.y > st.to)) return false;
    for(var i=0;i<dims.length;i++){
      var d=dims[i]; if(d===exceptDim) continue;
      var s=st.f[d], v=r[d];
      if(Array.isArray(v)){
        var hit=false; for(var j=0;j<v.length;j++) if(s.has(v[j])){ hit=true; break; }
        if(!hit) return false;
      } else if(!s.has(v)) return false;
    }
    return true;
  });
}
function founders(rs){ var s={}; rs.forEach(function(r){ s[r.f]=1; }); return Object.keys(s).length; }
function capital(rs){ return rs.reduce(function(a,r){ return a+r.amt; },0); }
/* Two founders carry conflicting "still in business" values across awards, so a
   founder counts once, on the verdict from their most recent participation. */
function surviving(rs){
  var latest={};
  rs.slice().sort(function(a,b){ return (a.y||0)-(b.y||0); }).forEach(function(r){
    latest[r.f]=r.alive; });
  var keys=Object.keys(latest), yes=0;
  keys.forEach(function(k){ if(latest[k]==='Yes') yes++; });
  return {yes:yes, total:keys.length};
}

/* Group rows by a dimension, counting distinct founders. */
function group(dim, rs, opts){
  opts=opts||{};
  var multi=DIMS[dim]&&DIMS[dim].multi, m={};
  rs.forEach(function(r){
    var v=r[dim];
    var list = multi ? v : (v===''||v==null ? [] : [v]);
    if(!list || !list.length){ if(opts.blank){ (m[opts.blank]=m[opts.blank]||{})[r.f]=1; } return; }
    list.forEach(function(x){ (m[x]=m[x]||{})[r.f]=1; });
  });
  var out=Object.keys(m).map(function(k){
    return {v:k, label:dimName(dim,k), n:Object.keys(m[k]).length}; });
  out.sort(function(a,b){ return b.n-a.n || String(a.label).localeCompare(b.label); });
  return opts.top ? out.slice(0,opts.top) : out;
}

/* ===================== svg helpers ===================== */
var UID=0;
function svgOpen(w,h,label){
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(label||'')+'">';
}
function isSel(d,v){ var s=st.f[d]; return !!(s&&s.has(v)); }
function dimHasSel(d){ var s=st.f[d]; return !!(s&&s.size); }
function markOpacity(d,v){ return !dimHasSel(d) ? 1 : (isSel(d,v) ? 1 : .34); }
var SERIES=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];

/* ---- clickable horizontal bars ---- */
function bars(dim, rs, opts){
  opts=opts||{};
  var data=group(dim, rs, {top:opts.top, blank:opts.blank});
  if(!data.length) return '<div class="empty">Nothing matches the current filters.</div>';
  var total=opts.pctOf!=null ? opts.pctOf : founders(rs);
  var W=340, rh=opts.rh||26, PADL=opts.padl||124, PADR=58;
  var max=Math.max.apply(null,data.map(function(r){return r.n;}))||1;
  var inner=W-PADL-PADR, o=[svgOpen(W, data.length*rh, DIMS[dim].label)];
  data.forEach(function(r,i){
    var y=i*rh, w=Math.max(3,(r.n/max)*inner), op=markOpacity(dim,r.v);
    var fit=Math.max(8,Math.floor((PADL-10)/6.0));
    var lab=r.label.length>fit ? r.label.slice(0,fit-1)+'\u2026' : r.label;
    var pct = total>=1 ? Math.round(100*r.n/total) : 0;
    var show = r.n>=5 ? pct+'%' : 'n<5';
    o.push('<text x="'+(PADL-9)+'" y="'+(y+rh/2+3.5)+'" text-anchor="end" font-size="11" '+
      'fill="var(--text-2)" opacity="'+op+'">'+esc(lab)+'</text>');
    o.push('<rect class="mk" data-d="'+dim+'" data-v="'+esc(r.v)+'" data-t="'+
      esc(r.label+'\n'+r.n+(r.n===1?' founder  ':' founders  ')+show)+'" x="'+PADL+'" y="'+(y+5)+'" width="'+w+
      '" height="'+(rh-12)+'" rx="'+((rh-12)/2)+'" fill="'+(opts.color||'var(--s1)')+
      '" opacity="'+op+'"/>');
    o.push('<text x="'+(PADL+w+8)+'" y="'+(y+rh/2+3.5)+'" font-size="10.5" fill="var(--text-2)" '+
      'font-family="JetBrains Mono, monospace" opacity="'+op+'">'+r.n+
      '<tspan fill="var(--text-3)">  '+show+'</tspan></text>');
  });
  return o.join('')+'</svg>';
}

/* ---- clickable donut with centred total ---- */
function donut(dim, rs, opts){
  opts=opts||{};
  var data=group(dim, rs, {top:5});
  var tot=data.reduce(function(a,r){return a+r.n;},0);
  if(!tot) return '<div class="empty">Nothing matches the current filters.</div>';
  var S=190, cx=S/2, cy=S/2, rO=S/2-6, rI=rO-26, a=-Math.PI/2;
  var o=[svgOpen(S,S,DIMS[dim].label)];
  data.forEach(function(r,i){
    var frac=r.n/tot, a2=a+frac*Math.PI*2, big=frac>.5?1:0;
    var x1=cx+rO*Math.cos(a), y1=cy+rO*Math.sin(a), x2=cx+rO*Math.cos(a2), y2=cy+rO*Math.sin(a2);
    var x3=cx+rI*Math.cos(a2), y3=cy+rI*Math.sin(a2), x4=cx+rI*Math.cos(a), y4=cy+rI*Math.sin(a);
    var d='M'+x1+' '+y1+'A'+rO+' '+rO+' 0 '+big+' 1 '+x2+' '+y2+'L'+x3+' '+y3+
          'A'+rI+' '+rI+' 0 '+big+' 0 '+x4+' '+y4+'Z';
    o.push('<path class="mk" data-d="'+dim+'" data-v="'+esc(r.v)+'" data-t="'+
      esc(r.label+'\n'+r.n+(r.n===1?' founder':' founders'))+
      '" d="'+d+'" fill="'+SERIES[i%5]+'" opacity="'+markOpacity(dim,r.v)+
      '" stroke="var(--card)" stroke-width="2"/>');
    a=a2;
  });
  o.push('<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="26" font-weight="600" '+
    'fill="var(--text)" letter-spacing="-1">'+founders(rs)+'</text>');
  o.push('<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="10" '+
    'fill="var(--text-3)" font-family="JetBrains Mono, monospace">FOUNDERS</text>');
  var leg=data.map(function(r,i){

      ' <b class="mono" style="font-weight:500">'+r.n+'</b></span>'; }).join('');
  return o.join('')+'</svg><div class="legend">'+leg+'</div>';
}

/* ---- gradient area over years, click a year to filter ---- */
function area(rs, opts){
  opts=opts||{};
  var m={};
  for(var y=st.from;y<=st.to;y++) m[y]={y:y, cap:0, f:{}};
  rs.forEach(function(r){ if(m[r.y]){ m[r.y].cap+=r.amt; m[r.y].f[r.f]=1; } });
  var pts=Object.keys(m).map(Number).sort(function(a,b){return a-b;}).map(function(y){
    return {y:y, v:opts.measure==='capital'?m[y].cap:Object.keys(m[y].f).length}; });
  if(pts.length<2) return '<div class="empty">Need at least two years in range.</div>';
  var W=700,H=180,PADL=46,PADR=14,PADB=26;
  var max=Math.max.apply(null,pts.map(function(p){return p.v;}))||1;
  var top=Math.pow(10,String(Math.round(max)).length-1); top=Math.ceil(max/top)*top||1;
  var iw=W-PADL-PADR, ih=H-PADB, step=iw/(pts.length-1);
  var X=function(i){ return PADL+i*step; }, Y=function(v){ return ih-(v/top)*ih; };
  var uid='g'+(++UID), o=[svgOpen(W,H,'Trend by year')];
  o.push('<defs><linearGradient id="'+uid+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--s1)" stop-opacity=".34"/>'+
    '<stop offset="100%" stop-color="var(--s1)" stop-opacity="0"/></linearGradient></defs>');
  [0,.5,1].forEach(function(k){
    var yy=ih-k*ih;
    o.push('<line x1="'+PADL+'" x2="'+(W-PADR)+'" y1="'+yy+'" y2="'+yy+
      '" stroke="var(--line)" stroke-width="1"/>');
    o.push('<text x="'+(PADL-8)+'" y="'+(yy+3.5)+'" text-anchor="end" font-size="9.5" '+
      'fill="var(--text-3)" font-family="JetBrains Mono, monospace">'+
      (opts.measure==='capital'?usd(top*k):Math.round(top*k))+'</text>');
  });
  var line=pts.map(function(p,i){ return (i?'L':'M')+X(i)+' '+Y(p.v); }).join('');
  o.push('<path d="'+line+'L'+X(pts.length-1)+' '+ih+'L'+PADL+' '+ih+'Z" fill="url(#'+uid+')"/>');
  o.push('<path d="'+line+'" fill="none" stroke="var(--s1)" stroke-width="2" '+
    'stroke-linejoin="round" stroke-linecap="round"/>');
  pts.forEach(function(p,i){
    var op=markOpacity('y',p.y);
    o.push('<circle class="mk" data-d="y" data-v="'+p.y+'" data-t="'+
      esc(p.y+'\n'+(opts.measure==='capital'?usdFull(p.v):p.v+' founders'))+
      '" cx="'+X(i)+'" cy="'+Y(p.v)+'" r="4.5" fill="var(--card)" stroke="var(--s1)" '+
      'stroke-width="2" opacity="'+op+'"/>');
    o.push('<text x="'+X(i)+'" y="'+(ih+16)+'" text-anchor="middle" font-size="9.5" '+
      'fill="var(--text-3)" font-family="JetBrains Mono, monospace" opacity="'+op+'">\u2019'+
      String(p.y).slice(2)+'</text>');
  });
  return o.join('')+'</svg>';
}

/* ---- ring gauge ---- */
function ring(part, total, label, color){
  var S=160, cx=S/2, cy=S/2, r=S/2-14, C=2*Math.PI*r;
  var frac=total?part/total:0;
  return svgOpen(S,S,label)+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--card-3)" stroke-width="13"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="13" '+
      'stroke-linecap="round" stroke-dasharray="'+(C*frac)+' '+C+'" '+
      'transform="rotate(-90 '+cx+' '+cy+')"/>'+
    '<text x="'+cx+'" y="'+(cy+1)+'" text-anchor="middle" font-size="25" font-weight="600" '+
      'fill="var(--text)" letter-spacing="-1">'+(total?(100*frac).toFixed(1):'0')+'%</text>'+
    '<text x="'+cx+'" y="'+(cy+18)+'" text-anchor="middle" font-size="9.5" fill="var(--text-3)" '+
      'font-family="JetBrains Mono, monospace">'+esc(label)+'</text></svg>';
}

/* ---- cross-tab matrix: click a cell to filter both dimensions ---- */
var SEP = '|~|';
function matrix(dimA, dimB, rs){
  var A=group(dimA, rs, {top:12}), B=group(dimB, rs, {top:8});
  if(!A.length||!B.length) return '<div class="empty">Nothing matches the current filters.</div>';
  var multiA=DIMS[dimA].multi, multiB=DIMS[dimB].multi;
  var cell={};
  rs.forEach(function(r){
    var av = multiA ? r[dimA] : (r[dimA]===''?[]:[r[dimA]]);
    var bv = multiB ? r[dimB] : (r[dimB]===''?[]:[r[dimB]]);
    av.forEach(function(a){ bv.forEach(function(b){
      var k=a+SEP+b; (cell[k]=cell[k]||{})[r.f]=1; }); });
  });
  var get=function(a,b){ var c=cell[a+SEP+b]; return c?Object.keys(c).length:0; };
  var max=0; A.forEach(function(a){ B.forEach(function(b){ max=Math.max(max,get(a.v,b.v)); }); });
  var head='<th></th>'+B.map(function(b){
    return '<th style="text-align:center;font-size:8.5px;max-width:78px;white-space:normal">'+
      esc(b.label)+'</th>'; }).join('')+'<th class="n">All</th>';
  var body=A.map(function(a){
    return '<tr><td style="font-size:11.5px;white-space:nowrap;max-width:150px;overflow:hidden;'+
      'text-overflow:ellipsis">'+esc(a.label)+'</td>'+
      B.map(function(b){
        var n=get(a.v,b.v), t=max?n/max:0;
        return '<td style="text-align:center;padding:3px 4px">'+
          '<div class="mk" data-d2="'+dimA+SEP+dimB+'" data-v2="'+esc(a.v)+SEP+esc(b.v)+
          '" data-t="'+esc(a.label+' x '+b.label+'\n'+n+(n===1?' founder':' founders'))+
          '" style="border-radius:7px;padding:7px 0;font-family:JetBrains Mono,monospace;'+
          'font-size:11px;font-variant-numeric:tabular-nums;background:color-mix(in srgb,'+
          'var(--s1) '+Math.round(t*78)+'%, var(--card-2));color:'+
          (t>.5?'#fff':'var(--text-2)')+'">'+(n||'.')+'</div></td>';
      }).join('')+'<td class="n" style="color:var(--text-3)">'+a.n+'</td></tr>';
  }).join('');
  return '<div class="scroll"><table class="tbl"><thead><tr>'+head+'</tr></thead><tbody>'+
    body+'</tbody></table></div>';
}

/* ---- kpi ---- */
function kpi(o){
  var spark='';
  if(o.spark && o.spark.length>1){
    var W=120,H=34,mx=Math.max.apply(null,o.spark)||1;
    var pts=o.spark.map(function(v,i){
      return (i?'L':'M')+(i*(W/(o.spark.length-1)))+' '+(H-(v/mx)*(H-4)-2); }).join('');
    spark='<svg class="kspark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<path d="'+pts+'L'+W+' '+H+'L0 '+H+'Z" fill="'+(o.color||'var(--s1)')+'" opacity=".12"/>'+
      '<path d="'+pts+'" fill="none" stroke="'+(o.color||'var(--s1)')+'" stroke-width="1.6"/></svg>';
  }
  return '<div class="kpi">'+spark+'<div class="kt"><span class="kdot" style="background:'+
    (o.color||'var(--s1)')+'"></span><span class="kl">'+esc(o.label)+'</span></div>'+
    '<div class="kv" style="color:'+(o.vc||'var(--text)')+'">'+o.value+'</div>'+
    (o.hint?'<div class="kh">'+o.hint+'</div>':'')+'</div>';
}
function card(o){
  return '<div class="card '+(o.span||'c6')+'"><div class="cardhead"><div><h4>'+esc(o.title)+
    '</h4></div>'+(o.right||'')+'</div>'+(o.cap?'<p class="cap">'+o.cap+'</p>':'')+o.body+'</div>';
}
function notice(kind,title,body,vs){
  return '<div class="notice" style="--c:var(--'+kind+')"><h4>'+esc(title)+'</h4><p>'+body+'</p>'+
    (vs?'<div class="vs">'+vs+'</div>':'')+'</div>';
}

var NAV=[
  {id:'overview',  t:'Overview',  n:''},
  {id:'explore',   t:'Explore',   n:''},
  {id:'discover',  t:'Discover',  n:'01'},
  {id:'apply_',    t:'Apply',     n:'02'},
  {id:'program',   t:'Program',   n:'03'},
  {id:'community', t:'Community', n:'04'},
  {id:'alumni',    t:'Alumni',    n:'05'}
];
var SUBS={
  overview:'Ten years across three organisation names. Click any mark to filter every chart.',
  explore:'Cross-tab any two dimensions. This is the answer to questions nobody wrote down.',
  discover:'How founders arrive. The census is the widest net and the highest quality file.',
  apply_:'Selection. The thinnest stage in the journey.',
  program:'Delivery. Cohorts, advising, volunteers and events.',
  community:'The network beyond the programme. Small numbers throughout.',
  alumni:'What happened after, and the one number that needs re-checking.'
};

/* ===================== url state ===================== */
function writeHash(){
  var p=['p='+st.page];
  if(st.from!==Y0) p.push('from='+st.from);
  if(st.to!==Y1) p.push('to='+st.to);
  if(st.page==='explore') p.push('xa='+st.xa, 'xb='+st.xb);
  activeDims().forEach(function(d){
    p.push('f.'+d+'='+encodeURIComponent(Array.from(st.f[d]).join('~'))); });
  history.replaceState(null,'','#'+p.join('&'));
}
function readHash(){
  var h=location.hash.replace(/^#/,''); if(!h) return;
  h.split('&').forEach(function(part){
    var i=part.indexOf('='); if(i<0) return;
    var k=part.slice(0,i), v=decodeURIComponent(part.slice(i+1));
    if(k==='p' && PAGES[v]) st.page=v;
    else if(k==='from' && +v) st.from=+v;
    else if(k==='to' && +v) st.to=+v;
    else if(k==='xa' && DIMS[v]) st.xa=v;
    else if(k==='xb' && DIMS[v]) st.xb=v;
    else if(k.indexOf('f.')===0){
      var d=k.slice(2);
      if(DIMS[d] && v) st.f[d]=new Set(v.split('~').map(function(x){
        return d==='y' ? +x : x; }));
    }
  });
}

/* ===================== render ===================== */
function renderChips(){
  var dims=activeDims();
  if(!dims.length){
    $('chips').innerHTML='<span class="chips-empty">No filters. Click any bar, segment or '+
      'cell to narrow everything at once.</span>';
    return;
  }
  var html='<span class="lab">Filters</span>';
  dims.forEach(function(d){
    Array.from(st.f[d]).forEach(function(v){
      html+='<button class="chip" data-rm="'+d+'" data-rmv="'+esc(v)+'">'+
        '<span class="d">'+esc(DIMS[d].label)+'</span>'+esc(dimName(d,v))+
        '<span class="x">\u00D7</span></button>';
    });
  });
  html+='<button class="chip-clear" id="clearall">Clear all</button>';
  $('chips').innerHTML=html;
}

function render(){
  $('nav').innerHTML='<div class="nl">Sections</div>'+NAV.map(function(t){
    return '<button data-p="'+t.id+'" aria-current="'+(st.page===t.id)+'">'+
      (t.n?'<span class="mono" style="font-size:9px;opacity:.6;width:14px">'+t.n+'</span>':
           '<span style="width:14px"></span>')+t.t+'</button>'; }).join('');
  $('pt').textContent=NAV.filter(function(t){return t.id===st.page;})[0].t;
  $('ptsub').textContent=SUBS[st.page];
  renderChips();
  $('view').innerHTML=PAGES[st.page]();
  writeHash();
}

/* ===================== events ===================== */
document.addEventListener('click',function(e){
  var p=e.target.closest('[data-p]');
  if(p){ st.page=p.dataset.p; render(); scrollTo({top:0,behavior:'smooth'}); return; }
  var rm=e.target.closest('[data-rm]');
  if(rm){ toggle(rm.dataset.rm, rm.dataset.rmv); return; }
  if(e.target.closest('#clearall')){ st.f={}; render(); return; }
  var m=e.target.closest('[data-d]');
  if(m){ var d=m.dataset.d, v=m.dataset.v;
    toggle(d, d==='y' ? +v : v); return; }
  var m2=e.target.closest('[data-d2]');
  if(m2){
    var ds=m2.dataset.d2.split(SEP), vs=m2.dataset.v2.split(SEP);
    ['0','1'].forEach(function(i){
      var dd=ds[i], vv=ds[i]==='y'?+vs[i]:vs[i], s=sel(dd);
      if(s.has(vv)) s.delete(vv); else s.add(vv);
      if(!s.size) delete st.f[dd];
    });
    render(); return;
  }
  var mm=e.target.closest('[data-m]');
  if(mm){ st.measure=mm.dataset.m; render(); return; }
});
document.addEventListener('mousemove',function(e){
  var t=e.target.closest('[data-t]');
  if(t) tipOn(e,t.dataset.t); else tipOff();
});
document.addEventListener('change',function(e){
  if(e.target.id==='xa'){ st.xa=e.target.value; render(); }
  if(e.target.id==='xb'){ st.xb=e.target.value; render(); }
});

/* year range */
function fill(sel_,list,cur){
  sel_.innerHTML=list.map(function(v){
    return '<option value="'+v+'"'+(+v===+cur?' selected':'')+'>'+v+'</option>'; }).join('');
}
var yopts=[]; for(var yy=Y0;yy<=Y1;yy++) yopts.push(yy);
$('fy').onchange=function(){ st.from=+this.value;
  if(st.to<st.from){ st.to=st.from; $('ty').value=st.to; } render(); };
$('ty').onchange=function(){ st.to=+this.value;
  if(st.from>st.to){ st.from=st.to; $('fy').value=st.from; } render(); };
$('copylink').onclick=function(){
  var b=this;
  navigator.clipboard.writeText(location.href).then(function(){
    b.textContent='Copied'; setTimeout(function(){ b.textContent='Copy link'; },1500);
  },function(){ b.textContent='Copy failed'; setTimeout(function(){ b.textContent='Copy link'; },1500); });
};

/* theme: explicit choice wins over the OS in both directions */
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{ localStorage.setItem('ff-theme',t); }catch(err){}
}
(function(){
  var saved=null;
  try{ saved=localStorage.getItem('ff-theme'); }catch(err){}
  setTheme(saved === 'dark' || saved === 'light' ? saved : 'light');
})();
$('theme').onclick=function(){
  setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
};

readHash();
fill($('fy'),yopts,st.from); fill($('ty'),yopts,st.to);
$('sf-src').textContent=FF.meta.sources.filter(function(s){return s.present;}).length+' of '+
  FF.meta.sources.length;
$('sf-rows').textContent=FF.meta.sources.reduce(function(a,s){return a+s.rows;},0).toLocaleString('en-US');
$('sf-gen').textContent=FF.meta.generated;
render();
})();
</script>
